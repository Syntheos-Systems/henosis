services:
  henosis:
    build:
      context: ..
      dockerfile: containers/Dockerfile
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      HENOSIS_HOME: /var/lib/henosis/.henosis
      HENOSIS_AUTO_INIT: quick
    ports: ["127.0.0.1:8088:8088"]
    volumes: ["henosis-state:/var/lib/henosis"]

volumes:
  henosis-state:
