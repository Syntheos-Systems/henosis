services:
  henosis:
    image: ${HENOSIS_IMAGE:?Set HENOSIS_IMAGE to an immutable Henosis image reference}
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    env_file: ["${HENOSIS_ENV_FILE:-.env.production}"]
    volumes:
      - henosis-state:/var/lib/henosis
      - ./secrets:/run/secrets/henosis:ro
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8088/health | grep -qx ok"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  henosis-state:
