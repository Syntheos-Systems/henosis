# Vendored Kleos workspace root, trimmed to ONLY the `kleos-lib` member.
#
# This file is the ONE hand-maintained file under `vendor/kleos/`. It is a trimmed
# copy of the upstream Kleos workspace root (`Kleos/Cargo.toml`), reduced to the
# single member `kleos-lib` so the vendored crate resolves its ~45 `{ workspace = true }`
# dependency refs against this root rather than the Henosis root. Everything under
# `vendor/kleos/kleos-lib/` is a pristine copy and must never be hand-edited.
#
# Source: Kleos `main` at commit 18e507677aa325cb2d7e164b4aa52a066b3a9a17
# Upstream mirror: git@github.com:Ghost-Frame/Kleos.git
#
# The `[workspace.dependencies]` table below is copied VERBATIM (versions and
# features included) from the upstream Kleos root so that kleos-lib's workspace
# dependency references resolve identically to upstream. See VENDOR.md for the
# read-only rule and the upstream-pull procedure.

[workspace]
resolver = "2"
members = ["kleos-lib"]
exclude = []

[workspace.package]
# kleos-lib uses `rust-version.workspace = true`; pin it here to match upstream.
rust-version = "1.94"

[workspace.dependencies]
rusqlite = "0.31"
tokio-rusqlite = "0.5"
deadpool-sqlite = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal", "fs", "net", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "set-header", "compression-gzip", "compression-br", "compression-zstd"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "multipart"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
ed25519-dalek = { version = "2", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
tokenizers = "0.22"
ndarray = "0.16"
dirs = "6"
regex = "1"
url = "2"
ipnet = "2"
zip = "2"
pdf-extract = "0.7"
rand = "0.9"
async-trait = "0.1"
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"
notify = "8"
notify-debouncer-mini = "0.6"
lancedb = { version = "0.27", default-features = false }
protoc-bin-vendored-linux-x86_64 = "3"
flate2 = "1"
hex = "0.4.3"
base64 = "0.22"
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
mimalloc = { version = "0.1", default-features = false }
lru = "0.16"
dashmap = "6"
arc-swap = "1"
walkdir = "2"
metrics = "0.24"
rust_decimal = { version = "1", features = ["serde-str"] }
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
# Dev/bench shared deps.
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Faster build for production deploys where pull-on-prod rebuilds the world.
# Thin LTO + parallel codegen cuts build time ~3-4x and target size materially,
# at a small runtime cost that is invisible for the memory server's workload.
[profile.release-prod]
inherits = "release"
lto = "thin"
codegen-units = 16
