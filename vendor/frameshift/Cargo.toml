[workspace]
resolver = "2"
members = [
    "frameshift-source",
    "frameshift-orchestrator",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Elastic-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tempfile = "3"
