# VENDORED + PATCHED copy of sqlx 0.8.6 (the facade crate only).
#
# WHY: henosis pulls rusqlite 0.31 (-> libsqlite3-sys 0.28) workspace-wide, including the
# pristine vendored kleos-lib. The upstream `sqlx` facade declares `sqlx-sqlite` as an
# optional dependency; cargo locks optional deps and enforces `links = "sqlite3"` uniqueness
# even when the feature is OFF, so sqlx 0.8.1+ (whose sqlx-sqlite needs libsqlite3-sys 0.30)
# cannot resolve against rusqlite's 0.28. henosis only ever uses sqlx for Postgres.
#
# This copy strips the `sqlx-sqlite` and `sqlx-mysql` optional deps (and every feature that
# references them) so the facade carries no sqlite/mysql backend at all. It is wired in via
# `[patch.crates-io] sqlx = { path = "vendor/sqlx" }` in the workspace root. That lets the
# Postgres stack advance to 0.8.6 (rustls 0.21 -> 0.23, fixing rustls-webpki GHSA-82j2 HIGH
# and the SQLx binary-protocol GHSA-xmrp MED) WITHOUT touching rusqlite or kleos-lib.
#
# src/ is byte-for-byte upstream 0.8.6 (all mysql/sqlite refs there are #[cfg]-gated and
# compile out). Only this manifest diverges. See vendor/sqlx/VENDOR.md.
[package]
edition = "2021"
name = "sqlx"
version = "0.8.6"
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
description = "Vendored Postgres-only fork of the sqlx facade (sqlite/mysql backends stripped). See VENDOR.md."
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"

[dependencies.sqlx-core]
version = "=0.8.6"
features = [
    "offline",
    "migrate",
]

[dependencies.sqlx-macros]
version = "=0.8.6"
optional = true

[dependencies.sqlx-postgres]
version = "=0.8.6"
optional = true

[features]
_rt-async-std = []
_rt-tokio = []
# Kept as an empty no-op feature: src cfg-gates sqlite re-exports on `_sqlite`, which is never
# enabled here (the sqlite backend is gone), so those blocks compile out.
_sqlite = []
_unstable-all-types = [
    "bigdecimal",
    "rust_decimal",
    "json",
    "time",
    "chrono",
    "ipnet",
    "ipnetwork",
    "mac_address",
    "uuid",
    "bit-vec",
    "bstr",
]
any = [
    "sqlx-core/any",
    "sqlx-postgres?/any",
]
bigdecimal = [
    "sqlx-core/bigdecimal",
    "sqlx-macros?/bigdecimal",
    "sqlx-postgres?/bigdecimal",
]
bit-vec = [
    "sqlx-core/bit-vec",
    "sqlx-macros?/bit-vec",
    "sqlx-postgres?/bit-vec",
]
bstr = ["sqlx-core/bstr"]
chrono = [
    "sqlx-core/chrono",
    "sqlx-macros?/chrono",
    "sqlx-postgres?/chrono",
]
default = [
    "any",
    "macros",
    "migrate",
    "json",
]
derive = ["sqlx-macros/derive"]
ipnet = [
    "sqlx-core/ipnet",
    "sqlx-macros?/ipnet",
    "sqlx-postgres?/ipnet",
]
ipnetwork = [
    "sqlx-core/ipnetwork",
    "sqlx-macros?/ipnetwork",
    "sqlx-postgres?/ipnetwork",
]
json = [
    "sqlx-core/json",
    "sqlx-macros?/json",
    "sqlx-postgres?/json",
]
mac_address = [
    "sqlx-core/mac_address",
    "sqlx-macros?/mac_address",
    "sqlx-postgres?/mac_address",
]
macros = [
    "derive",
    "sqlx-macros/macros",
]
migrate = [
    "sqlx-core/migrate",
    "sqlx-macros?/migrate",
    "sqlx-postgres?/migrate",
]
postgres = [
    "sqlx-postgres",
    "sqlx-macros?/postgres",
]
runtime-async-std = [
    "_rt-async-std",
    "sqlx-core/_rt-async-std",
    "sqlx-macros?/_rt-async-std",
]
runtime-async-std-native-tls = [
    "runtime-async-std",
    "tls-native-tls",
]
runtime-async-std-rustls = [
    "runtime-async-std",
    "tls-rustls-ring",
]
runtime-tokio = [
    "_rt-tokio",
    "sqlx-core/_rt-tokio",
    "sqlx-macros?/_rt-tokio",
]
runtime-tokio-native-tls = [
    "runtime-tokio",
    "tls-native-tls",
]
runtime-tokio-rustls = [
    "runtime-tokio",
    "tls-rustls-ring",
]
rust_decimal = [
    "sqlx-core/rust_decimal",
    "sqlx-macros?/rust_decimal",
    "sqlx-postgres?/rust_decimal",
]
time = [
    "sqlx-core/time",
    "sqlx-macros?/time",
    "sqlx-postgres?/time",
]
tls-native-tls = [
    "sqlx-core/_tls-native-tls",
    "sqlx-macros?/_tls-native-tls",
]
tls-none = []
tls-rustls = ["tls-rustls-ring"]
tls-rustls-aws-lc-rs = [
    "sqlx-core/_tls-rustls-aws-lc-rs",
    "sqlx-macros?/_tls-rustls-aws-lc-rs",
]
tls-rustls-ring = ["tls-rustls-ring-webpki"]
tls-rustls-ring-native-roots = [
    "sqlx-core/_tls-rustls-ring-native-roots",
    "sqlx-macros?/_tls-rustls-ring-native-roots",
]
tls-rustls-ring-webpki = [
    "sqlx-core/_tls-rustls-ring-webpki",
    "sqlx-macros?/_tls-rustls-ring-webpki",
]
uuid = [
    "sqlx-core/uuid",
    "sqlx-macros?/uuid",
    "sqlx-postgres?/uuid",
]
