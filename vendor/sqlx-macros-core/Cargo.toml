# VENDORED + PATCHED copy of sqlx-macros-core 0.8.6 (Postgres-only).
#
# Companion to vendor/sqlx. sqlx-macros-core declares `sqlx-sqlite` (and `sqlx-mysql`) as
# OPTIONAL dependencies for compile-time/offline query checking. Cargo locks optional deps and
# enforces `links = "sqlite3"` uniqueness even when unactivated, so the phantom `sqlx-sqlite`
# re-enters through the macros crate and collides with the workspace's rusqlite 0.31
# (libsqlite3-sys 0.28) -- exactly as it does through the facade. This copy strips both backend
# optional deps so no `sqlx-sqlite` survives anywhere in the graph.
#
# src/ is byte-for-byte upstream 0.8.6: all sqlx_mysql / sqlx_sqlite references are #[cfg]-gated
# on the `mysql` / `_sqlite` features (kept as empty no-op features here, never enabled), so they
# compile out. Only this manifest diverges. Wired via [patch.crates-io] in the workspace root.
# See vendor/sqlx/VENDOR.md.
[package]
edition = "2021"
name = "sqlx-macros-core"
version = "0.8.6"
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
description = "Vendored Postgres-only fork of sqlx-macros-core (sqlite/mysql backends stripped). See vendor/sqlx/VENDOR.md."
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"

[dependencies.async-std]
version = "1.12"
optional = true

[dependencies.dotenvy]
version = "0.15.7"
default-features = false

[dependencies.either]
version = "1.6.1"

[dependencies.heck]
version = "0.5"

[dependencies.hex]
version = "0.4.3"

[dependencies.once_cell]
version = "1.9.0"

[dependencies.proc-macro2]
version = "1.0.79"
default-features = false

[dependencies.quote]
version = "1.0.26"
default-features = false

[dependencies.serde]
version = "1.0.132"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.73"

[dependencies.sha2]
version = "0.10.0"

[dependencies.sqlx-core]
version = "=0.8.6"
features = ["offline"]

[dependencies.sqlx-postgres]
version = "=0.8.6"
features = [
    "offline",
    "migrate",
]
optional = true

[dependencies.syn]
version = "2.0.52"
features = [
    "full",
    "derive",
    "parsing",
    "printing",
    "clone-impls",
]
default-features = false

[dependencies.tokio]
version = "1"
features = [
    "time",
    "net",
    "sync",
    "fs",
    "io-util",
    "rt",
]
optional = true
default-features = false

[dependencies.url]
version = "2.2.2"

[features]
_rt-async-std = [
    "async-std",
    "sqlx-core/_rt-async-std",
]
_rt-tokio = [
    "tokio",
    "sqlx-core/_rt-tokio",
]
# Empty no-op features: src cfg-gates the removed sqlite/mysql backends on these, which are never
# enabled, so those blocks compile out. Kept defined so the cfgs stay "expected" (no lint noise).
_sqlite = []
mysql = []
_tls-native-tls = ["sqlx-core/_tls-native-tls"]
_tls-rustls-aws-lc-rs = ["sqlx-core/_tls-rustls-aws-lc-rs"]
_tls-rustls-ring-native-roots = ["sqlx-core/_tls-rustls-ring-native-roots"]
_tls-rustls-ring-webpki = ["sqlx-core/_tls-rustls-ring-webpki"]
bigdecimal = [
    "sqlx-core/bigdecimal",
    "sqlx-postgres?/bigdecimal",
]
bit-vec = [
    "sqlx-core/bit-vec",
    "sqlx-postgres?/bit-vec",
]
chrono = [
    "sqlx-core/chrono",
    "sqlx-postgres?/chrono",
]
default = []
derive = []
ipnet = [
    "sqlx-core/ipnet",
    "sqlx-postgres?/ipnet",
]
ipnetwork = [
    "sqlx-core/ipnetwork",
    "sqlx-postgres?/ipnetwork",
]
json = [
    "sqlx-core/json",
    "sqlx-postgres?/json",
]
mac_address = [
    "sqlx-core/mac_address",
    "sqlx-postgres?/mac_address",
]
macros = []
migrate = ["sqlx-core/migrate"]
postgres = ["sqlx-postgres"]
rust_decimal = [
    "sqlx-core/rust_decimal",
    "sqlx-postgres?/rust_decimal",
]
time = [
    "sqlx-core/time",
    "sqlx-postgres?/time",
]
uuid = [
    "sqlx-core/uuid",
    "sqlx-postgres?/uuid",
]

# Path dependency: lints are not capped as they would be for a registry dep. Upstream already
# ships unexpected-cfg checks (sqlx_macros_unstable, procmacro2_semver_exempt) and our stripped
# backends add more -- cap them to match registry-dep quietness.
[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
