[workspace]
resolver = "2"
members = [
    "crates/syntheos-memory-gateway",
    "crates/syntheos-contracts",
    "crates/syntheos-axon",
    "crates/syntheos-axon-durable",
    "crates/syntheos-dispatch",
    "crates/syntheos-identity",
    "crates/syntheos-server",
    "crates/henosis-audit",
    "crates/henosis-approval",
    "crates/henosis-witness",
    "crates/henosis-component-host",
    "crates/henosis-chiasm",
    "crates/henosis-soma",
    "crates/henosis-broca",
    "crates/henosis-loom",
    "crates/henosis-thymus",
    "crates/henosis-sqlite",
    "crates/henosis-eidolon",
    "crates/henosis-credential-store",
    "crates/henosis-pistis",
    "crates/henosis-memory-client",
    "crates/agent-forge-lib",
    "crates/synapse-provider",
    "crates/synapse-session",
    "crates/synapse-tools",
    "crates/synapse-core",
    "crates/synapse-cron",
    "crates/synapse-cli",
    "crates/synapse-tui",
    "crates/henosis-rift-server",
    "crates/henosis-rift-bridge",
    "crates/henosis-rift",
    "crates/henosis-cognition",
    "crates/henosis-plutus",
    "crates/henosis-hephaestus",
    "crates/henosis-hermes",
]
# Kleos `kleos-lib` is vendored at vendor/kleos/ as a NESTED, EXCLUDED workspace. It resolves
# against its own root (vendor/kleos/Cargo.toml), so excluding it keeps zero blast radius on
# existing Henosis crates. See vendor/kleos/VENDOR.md.
# vendor/frameshift is a pinned, excluded workspace containing the two persona-selection crates
# Henosis consumes. See vendor/frameshift/VENDOR.md.
# vendor/sqlx is a [patch.crates-io] Postgres-only fork of the sqlx facade -- excluded so it is
# not treated as a workspace member; it is pulled in only through the patch below. See
# vendor/sqlx/VENDOR.md.
exclude = ["vendor/kleos", "vendor/frameshift", "vendor/sqlx", "vendor/sqlx-macros-core"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Elastic-2.0"
repository = "https://github.com/Syntheos-Systems/henosis"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem", "zeroize"] }
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
rand = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v8", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
async-trait = "0.1"
# SQLite for kernel-service storage. Per-crate `bundled` features avoid a system libsqlite
# dependency; kernel stores apply ordered migrations through PRAGMA user_version.
rusqlite = { version = "0.31" }
# Postgres storage for Rift, Hermes, Hephaestus, Plutus, and production authority services.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid"] }
zeroize = { version = "1", features = ["derive"] }
# Field-level AES-256-GCM encryption for the embedded credential compatibility store.
aes-gcm = "0.10"
# Credential signing and verification with a keyed MAC.
hmac = "0.12"
# Constant-time MAC comparison during credential verification.
subtle = "2.5"
# Ed25519 credential signing and verification over stored OpenSSH private keys.
ssh-key = { version = "0.6", features = ["ed25519"] }
# Property testing for security-critical EidolonGate fail-closed invariants. Dev-only.
proptest = "1"
# Eidolon supervisor: session-JSONL watching, rule regexes, and a bounded file-position cache.
notify = "8"
notify-debouncer-mini = "0.6"
regex = "1"
lru = "0.16"
yubikey = { version = "0.8" }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
# Home and cache directory resolution for the memory-client session-token cache.
dirs = "5"
# Shared dependencies for the Synapse provider and session runtime.
anyhow = "1"
log = "0.4"
futures = "0.3"
async-stream = "0.3"
# SSE streaming for LLM provider responses (Anthropic/OpenAI-style token streams).
eventsource-stream = "0.2"
reqwest-eventsource = "0.6"
# Binary discovery on PATH (claude_max / codex provider subprocess lookup).
which = "7"
# Hostname detection for the memory-client agent label (synapse-tools/cli auth cascade).
hostname = "0.4"
# Async stream adapters for the synapse-core provider response pipeline.
tokio-stream = "0.1"
# Concurrent session map for the synapse-core multi-session runtime.
dashmap = "6"
# Logging backend for the synapse-cli / synapse-tui binaries.
env_logger = "0.11"
# Terminal UI for synapse-tui (ratatui renderer over a crossterm backend).
ratatui = "0.29"
crossterm = "0.28"
# Component Model runtime for signed third-party tool extensions. This is exact-pinned so the
# sandbox ABI and security review do not drift underneath a release.
wasmtime = { version = "=36.0.12", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }

# Postgres-only fork of the sqlx facade. Upstream sqlx declares `sqlx-sqlite` as an optional
# dependency; cargo locks optional deps and enforces `links = "sqlite3"` uniqueness even with the
# sqlite feature off, so sqlx 0.8.1+ (sqlx-sqlite needs libsqlite3-sys 0.30) cannot resolve against
# our workspace-wide rusqlite 0.31 (libsqlite3-sys 0.28, incl. the pristine vendored kleos-lib).
# This fork drops the sqlite/mysql backends so the Postgres stack advances to 0.8.6 -- pulling
# rustls 0.23 / rustls-webpki 0.103.13 -- fixing GHSA-82j2 (HIGH) + GHSA-xmrp (MED) with rusqlite
# untouched. See vendor/sqlx/VENDOR.md.
[patch.crates-io]
sqlx = { path = "vendor/sqlx" }
# sqlx-macros-core ALSO declares sqlx-sqlite/sqlx-mysql as optional deps (compile-time query
# checking), so the phantom sqlx-sqlite re-enters through the macros crate even with the facade
# patched. This fork strips those backends too. Must move in lockstep with vendor/sqlx.
sqlx-macros-core = { path = "vendor/sqlx-macros-core" }
