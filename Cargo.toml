[workspace]
resolver = "2"
members = [
    "crates/syntheos-memory-gateway",
    "crates/syntheos-contracts",
    "crates/syntheos-axon",
    "crates/syntheos-dispatch",
    "crates/syntheos-identity",
    "crates/syntheos-server",
    "crates/henosis-chiasm",
    "crates/henosis-soma",
    "crates/henosis-broca",
    "crates/henosis-loom",
    "crates/henosis-thymus",
    "crates/agent-forge-lib",
]

[workspace.package]
edition = "2021"
license = "Elastic-2.0"
repository = "https://github.com/Syntheos-Systems/syntheos-os"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
rand = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v8", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
async-trait = "0.1"
# SQLite for kernel-service storage (matches Kleos's rusqlite 0.31). Per-crate `bundled` feature
# avoids a system libsqlite dependency. Migration convention: PRAGMA user_version + ordered
# migrations/Vn__*.sql -- see 2026-06-10-henosis-db-and-migration-convention.md.
rusqlite = { version = "0.31" }
# Postgres for runtime-service storage (Rift, Hermes, Hephaestus, Plutus). Declared now so those
# crates inherit one pinned version; unused until the first Postgres crate lands.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid"] }
zeroize = { version = "1", features = ["derive"] }
yubikey = { version = "0.8" }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
