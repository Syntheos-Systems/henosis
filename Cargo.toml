[workspace]
resolver = "2"
members = ["crates/syntheos-memory-gateway", "crates/syntheos-contracts", "crates/syntheos-axon"]

[workspace.package]
edition = "2021"
license = "Elastic-2.0"
repository = "https://github.com/Syntheos-Systems/syntheos-os"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
rand = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v8", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
async-trait = "0.1"
zeroize = { version = "1", features = ["derive"] }
yubikey = { version = "0.8" }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
