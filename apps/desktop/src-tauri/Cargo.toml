[package]
name = "henosis"
version = "0.1.0-alpha.6"
description = "Henosis graphical operating environment for persistent agents"
edition = "2024"
rust-version = "1.88"

# Keep desktop platform dependencies out of the headless Henosis server workspace.
[workspace]

[lib]
name = "henosis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "henosis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = { version = "0.3.33", default-features = false, features = ["async-await", "sink", "std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
url = "2.5.8"
