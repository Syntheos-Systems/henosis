[package]
name = "henosis-cognition"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin in-process facade over the vendored kleos-lib cognitive core (memory, context, storage organism)."

[dependencies]
# The vendored Kleos library is depended on BY PATH so its heavy ML stack
# (ort/tokenizers/lancedb/arrow/datafusion) resolves against the nested
# vendor/kleos workspace and never routes through the Henosis workspace deps.
# Keep the cognitive dependencies required by this facade while excluding the
# unused generic gate and grounding execution APIs from Henosis builds.
kleos-lib = { path = "../../vendor/kleos/kleos-lib", default-features = false, features = ["brain_hopfield", "ml"] }
# Async runtime for the pass-through methods (all kleos-lib core fns are async).
tokio = { workspace = true }
# The facade error type wraps kleos-lib's `EngError`.
thiserror = { workspace = true }
# forge pass-through return values are JSON blobs returned directly from kleos-lib.
serde_json = { workspace = true }

[dev-dependencies]
# The lightweight-session round-trip test opens a tempfile-backed store.
tempfile = "3"
