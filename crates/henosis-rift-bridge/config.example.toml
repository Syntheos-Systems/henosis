# Export Kleos credentials before running the bridge:
#   export KLEOS_URL=http://127.0.0.1:4200
#   export KLEOS_API_KEY=eg_your_key_here

[rift]
api_url = "http://localhost:3200"
ws_url = "ws://localhost:3200/ws"
jwt_secret = "your-jwt-secret-here"
server_id = "00000000-0000-0000-0000-000000000000"
channel_id = "00000000-0000-0000-0000-000000000000"
pause_poll_secs = 5

[bridge]
cooldown_secs = 30        # min seconds between two posts by the SAME agent
turn_budget = 5           # max turns per agent per topic
thread_ceiling = 30       # hard cap on total agent posts per topic
context_window = 50
# Compose slots (spec P1): each agent composes inside its own window
# [slot_index * slot_width_ms, + slot_jitter_ms]. Jitter must stay below the
# width or it is clamped -- overlapping windows are the bug this replaces.
slot_width_ms = 6000
slot_jitter_ms = 4000
# Agent-to-agent conversation: max cascade rounds one inbound message can
# trigger (budgets/ceiling/cooldown/consensus also bound each round).
max_cascade_rounds = 8
# Cross-agent echo suppression threshold (Jaccard token overlap, 0.0-1.0).
echo_similarity_threshold = 0.5
# Per-peer-response probability multiplier for non-addressed agents.
peer_response_damp = 0.4
# DEPRECATED: shared jitter range, replaced by the slot geometry above.
# Still parsed so old configs load; no longer used.
jitter_range_ms = [2000, 8000]

# --- Agent definitions ---

# Agent using ClaudeCode executor (shells out to `claude -p`, no tool access)
[[agents]]
name = "Reviewer"
username = "agent-reviewer"
base_chance = 0.3
system_prompt = "You are a code reviewer. Focus on correctness, edge cases, and maintainability."

[agents.executor]
type = "ClaudeCode"
binary = "claude"
model = "sonnet"

# Agent using Synapse with Foundry Anthropic provider (full tool access)
[[agents]]
name = "Architect"
username = "agent-architect"
base_chance = 0.3
system_prompt = "You are a software architect. Focus on system design, boundaries, and trade-offs."

[agents.executor]
type = "Synapse"
provider = "foundry-anthropic"
host = "your-foundry-host.example.com"
token = "your-foundry-token"
model = "claude-sonnet-4-6"
max_tokens = 4096

# Agent using Synapse with Claude Max provider (full tool access via Max subscription)
[[agents]]
name = "Builder"
username = "agent-builder"
base_chance = 0.3
system_prompt = "You are a builder. You write code, run tests, and ship features."

[agents.executor]
type = "Synapse"
provider = "claude-max"
model = "claude-sonnet-4-6"
max_tokens = 4096
max_turns = 4
cwd = "/path/to/agent/workspace"

# --- Execution mode -------------------------------------------------------

# Per-agent capability allowlist. Agents may only execute tasks whose required
# capabilities are all listed here. Capability names: fs_read, fs_write, bash, network.
[capabilities]
architect = ["fs_read", "fs_write", "bash"]
reviewer  = ["fs_read"]

# Repositories an approved task may execute against. The workspace whose name
# matches the project ("rift") is preferred; otherwise the first is used.
[[workspaces]]
name = "rift"
path = "/path/to/rift"
# cargo_target_dir = "/path/to/build-cache"   # optional

# Execution runtime settings. Omit this block to disable execution mode entirely.
[execution]
worktrees_root = "/path/to/rift/.worktrees"
max_concurrent_executions = 1
approval_ttl_secs = 1800
max_runtime_secs = 1800

# Optional Pistis-backed authorization. When enabled, the bridge asks the
# Pistis orchestrator whether an agent may execute the requested capabilities.
[pistis]
enabled = false
orchestrator_url = "http://127.0.0.1:7070"
auth_token_cred = "pistis/signer-token"
room = "!pistis:example.com"

# HTTP control server for approvals. Omit to disable; in-channel !approve still works.
[control]
bind_addr = "127.0.0.1:3210"
auth_token = "set-me"   # require: Authorization: Bearer set-me

# Optional Frameshift persona allocation. Absent disables personas entirely.
# When present, agents are assigned thread-stable personas (with collision
# avoidance and an optional challenger slot), and message-to-persona relevance
# scales engagement. Each agent also gets a growth file under growth_root.
# [personas]
# library_path = "/path/to/frameshift/personas"
# growth_root = "/path/to/rift/growth"
# max_same_persona = 2
# challenger_slot = true

# Optional OpenAI-compatible embeddings endpoint. When present, echo
# suppression uses cosine similarity (catches paraphrased echoes token
# overlap misses) and exhausted topics damp semantically similar re-triggers.
# Absent = token-overlap detection only. Works with OpenAI, TEI, and Ollama.
# [embedding]
# url = "http://127.0.0.1:11434/v1/embeddings"
# model = "bge-m3"
# api_key_env = "EMBEDDING_API_KEY"   # env var holding the bearer token; omit for local endpoints
# semantic_threshold = 0.85           # cosine at/above which a candidate is an echo
# reignition_threshold = 0.85         # cosine at/above which a trigger reignites an exhausted topic
# reignition_damp = 0.3               # engagement multiplier on reignited topics (1.0 disables)
# reignition_ttl_secs = 21600         # how long an exhausted topic stays live (6h)

# Optional stimulus injector: wakes the room with project signals instead of
# waiting for a human. Sources: scheduled reflection after inactivity, Chiasm
# active-task changes, and git HEAD movement in the declared [[workspaces]].
# Stimuli are announced as "[STIMULUS] ..." posts, sanitized, per-source
# cooled down, and globally rate capped. Omit (or enabled = false) to disable.
# [stimulus]
# enabled = true
# poll_secs = 60                # seconds between source polls
# reflection_after_secs = 14400 # room inactivity before a reflection prompt (4h)
# chiasm_cooldown_secs = 900    # min spacing between task-change stimuli
# git_cooldown_secs = 300       # min spacing between commit stimuli
# axon_cooldown_secs = 600    # min spacing between Axon activity stimuli
# loom_cooldown_secs = 600    # min spacing between workflow-run stimuli
# max_per_hour = 6              # global cap across all stimulus kinds
