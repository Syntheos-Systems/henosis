[package]
name = "henosis-rift-bridge"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent bridge connecting Rift rooms to Synapse and Henosis services."

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (for Rift REST API)
reqwest = { version = "0.12", features = ["json"] }

# WebSocket client (for Rift WS gateway)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
henosis-pistis = { path = "../henosis-pistis" }
syntheos-contracts = { path = "../syntheos-contracts" }
urlencoding = "2"

# Auth. jsonwebtoken 10 fixes GHSA-h395-gr6q-cpjc (type-confusion auth bypass) and splits crypto
# backends -- pick rust_crypto to match the workspace's RustCrypto stack. HS256 API unchanged from 9.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

# Types
uuid = { version = "1", features = ["v4", "v5", "v8", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Random (for engagement rolls, jitter)
rand = "0.9"

# Async traits
async-trait = "0.1"

# HTTP control server (approval endpoint)
axum = "0.8"
hmac.workspace = true
sha2.workspace = true

# Synapse agent loop engine (local development path dependency)
synapse-core = { path = "../synapse-core" }
synapse-provider = { path = "../synapse-provider" }
synapse-tools = { path = "../synapse-tools" }

# anyhow (synapse-core's error type at the AgentExecutor boundary)
anyhow = "1"

# Pinned FrameShift persona selection engine in the excluded vendor workspace.
frameshift-orchestrator = { path = "../../vendor/frameshift/frameshift-orchestrator" }

# In-process Kleos seam (Story 4.4 step 3): InProcessKleosClient backs the
# KleosClient trait with the henosis kernel stores instead of HTTP-to-Kleos.
henosis-chiasm = { path = "../henosis-chiasm" }
henosis-broca = { path = "../henosis-broca" }
# Default memory backend: route the two memory ops to upstream Kleos via the
# workspace memory client (generic signed HTTP). Under the `cognition` feature
# the in-process cognition store replaces this for in-process memory (Wave 3).
henosis-memory-client = { path = "../henosis-memory-client" }
# AxonBus is required to open in-process Chiasm/Broca stores (main.rs backend).
syntheos-axon = { path = "../syntheos-axon" }
# The in-process cognition store (Wave 3). OPTIONAL: only the `cognition` feature
# pulls it -- and with it the vendored kleos-lib ML stack -- in, so the default
# bridge build stays free of ort/tokenizers/lancedb.
henosis-cognition = { path = "../henosis-cognition", optional = true }

[features]
default = []
# Route the bridge's in-process memory ops through the local cognition store
# instead of HTTP-to-Kleos. Adds the CognitionMemoryBackend and pulls kleos-lib in.
cognition = ["dep:henosis-cognition"]

[dev-dependencies]
# In-memory kernel stores need an AxonBus to construct in the trait tests.
syntheos-axon = { path = "../syntheos-axon" }
