[package]
name = "synapse-core"
version = "0.1.0"
edition = "2024"

[dependencies]
synapse-provider = { path = "../synapse-provider" }
synapse-tools = { path = "../synapse-tools" }
synapse-session = { path = "../synapse-session" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
dirs.workspace = true
toml = "0.8"
dashmap = { workspace = true }
# In-process persona ranking (Story 4.3): replaces the `frameshift select`
# subprocess. The pinned source lives in Henosis's excluded FrameShift vendor
# workspace so clean checkouts do not depend on a sibling repository.
frameshift-orchestrator = { path = "../../vendor/frameshift/frameshift-orchestrator" }

[dev-dependencies]
tempfile = "3"
