# Absorbed from ~/projects/rift/server (Story 4.4, copy-and-own). Upstream rift
# stays standalone; this is a snapshot wired into the henosis workspace.
[package]
name = "henosis-rift-server"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rift room, message, membership, WebSocket, and approval server."

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Auth. jsonwebtoken 10 fixes GHSA-h395-gr6q-cpjc (type-confusion auth bypass) and splits crypto
# backends -- pick rust_crypto (pure-Rust HMAC/sha2) to match the workspace's RustCrypto stack and
# avoid a C toolchain. HS256-from_secret API is unchanged from 9, so no code changes.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
argon2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures = "0.3"
dashmap = "6"
sha2 = "0.10"
