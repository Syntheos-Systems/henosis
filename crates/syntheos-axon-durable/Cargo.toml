[package]
name = "syntheos-axon-durable"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable write-through sidecar for the in-process Axon bus: SQLite persistence, replay, and consumer cursors (G3 split: telemetry stays lossy, audit goes here)."

[dependencies]
# AxonEnvelope, TypedEvent, and the canonical ids the rows are keyed by.
syntheos-contracts = { path = "../syntheos-contracts" }
# The wrapped in-process bus the write-through fans out on.
syntheos-axon = { path = "../syntheos-axon" }
# SQLite backend (bundled = no system libsqlite). Migration convention: PRAGMA user_version.
rusqlite = { workspace = true, features = ["bundled"] }
# DurableAxonError.
thiserror.workspace = true
# Envelope payload (de)serialization for the persisted rows.
serde_json.workspace = true

[dev-dependencies]
# Runtime + macros for #[tokio::test] (the live-fanout assertions await a subscriber).
tokio = { workspace = true }
# Derive for the typed test event.
serde = { workspace = true }
