[package]
name = "syntheos-axon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process pub/sub bus carrying syntheos-contracts AxonEnvelopes over tokio broadcast."

[dependencies]
# The canonical envelope/event contracts this bus carries.
syntheos-contracts = { path = "../syntheos-contracts" }
# Library needs the broadcast primitive only, not the full tokio runtime.
tokio = { version = "1", features = ["sync"] }
# serde is named directly (DeserializeOwned bound on the typed receive path).
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Workspace tokio is "full" -- pulls in the macros + runtime for #[tokio::test].
tokio = { workspace = true }
# Test event types derive Serialize/Deserialize.
serde = { workspace = true }
