[package]
name = "henosis-soma"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Soma: the agent presence + quality kernel service, extracted onto syntheos-contracts + in-process Axon."

[dependencies]
# Canonical ids (PrincipalId/TenantId), Timestamp, and the TypedEvent trait.
syntheos-contracts = { path = "../syntheos-contracts" }
# In-process bus the presence lifecycle events are published onto.
syntheos-axon = { path = "../syntheos-axon" }
# PrincipalDirectory: registration verifies the agent principal exists (it never mints one).
syntheos-identity = { path = "../syntheos-identity" }
# SQLite backend (bundled = no system libsqlite). Migration convention: PRAGMA user_version.
rusqlite = { workspace = true, features = ["bundled"] }
# SomaError.
thiserror.workspace = true
# Status (de)serialization, capability/config JSON, and event payloads.
serde = { workspace = true }
serde_json.workspace = true
# Fire-and-forget event-emission failures are logged, never fatal.
tracing.workspace = true
# Heartbeat staleness window arithmetic (Timestamp wraps time::OffsetDateTime).
time.workspace = true

[dev-dependencies]
# Workspace tokio is "full" -- runtime + macros for #[tokio::test].
tokio = { workspace = true }
