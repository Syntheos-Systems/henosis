[package]
name = "syntheos-server"
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The single HTTP entry point that boots the Henosis foundation."

[[bin]]
name = "henosis"
path = "src/main.rs"

[dependencies]
# Core contracts, event transport, dispatch, identity, approvals, and audit.
syntheos-contracts = { path = "../syntheos-contracts" }
syntheos-axon = { path = "../syntheos-axon" }
syntheos-dispatch = { path = "../syntheos-dispatch" }
syntheos-identity = { path = "../syntheos-identity" }
henosis-approval = { path = "../henosis-approval" }
henosis-audit = { path = "../henosis-audit" }
# Stateful kernel services wired into AppState.
henosis-chiasm = { path = "../henosis-chiasm" }
henosis-soma = { path = "../henosis-soma" }
henosis-broca = { path = "../henosis-broca" }
henosis-loom = { path = "../henosis-loom" }
# In-process Hephaestus executor wired into Loom's CompositeStepExecutor.
henosis-hephaestus = { path = "../henosis-hephaestus" }
henosis-thymus = { path = "../henosis-thymus" }
# Eidolon policy gate and output filter.
henosis-eidolon = { path = "../henosis-eidolon" }
# Pistis capability authority.
henosis-pistis = { path = "../henosis-pistis" }
# Embedded credential compatibility store used by loopback integrations and tests.
henosis-credential-store = { path = "../henosis-credential-store" }
# Rift-backed human approval authority.
henosis-rift = { path = "../henosis-rift" }
# The external tool gateway, invoked in-process after the canonical gate chain allows an action.
henosis-hermes = { path = "../henosis-hermes" }
# Plutus policy authority.
henosis-plutus = { path = "../henosis-plutus" }
# Optional cognitive-core facade over vendored kleos-lib. Only the `cognition` feature pulls in
# the heavy ML stack, so the default Henosis build excludes ort, tokenizers, and LanceDB.
henosis-cognition = { path = "../henosis-cognition", optional = true }
# JWT session tokens for the operator API surface (HS256 via pure-Rust crypto).
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
# Structured error types for the operator surface.
thiserror.workspace = true
# Decoding credential material represented as hexadecimal.
hex.workspace = true
# Credential signatures, derived bytes, and scrubbed command output use base64 on the wire.
base64.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
uuid.workspace = true
rand.workspace = true
zeroize.workspace = true
# Synchronous, redirect-disabled HTTP client for short-lived operator CLI commands.
reqwest = { workspace = true, features = ["blocking"] }
libc = "0.2"
# Clock support for the Stripe webhook signature tolerance window, matching the verifier owner.
chrono = "0.4"
# HTTP surface.
axum = { workspace = true, features = ["ws"] }
# Global concurrency cap on the HTTP surface (resource-limit hardening).
tower = { version = "0.5", features = ["limit"] }
# Per-request timeout layer (resource-limit hardening); "cors" backs the operator surface's
# browser/webview CORS layer (Athena Tauri app + Vite dev server preflight support).
tower-http = { version = "0.6", features = ["timeout", "cors"] }
# Full runtime: the binary needs rt, net, signal, and macros.
tokio = { workspace = true }
# EnrollRequest body.
serde.workspace = true
# JSON responses.
serde_json.workspace = true
# The QualitySink adapter (Thymus -> Soma) implements an async trait.
async-trait.workspace = true
# Structured logging.
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows descriptor flags reject reparse-point leaves before configuration reads.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# ServiceExt::oneshot drives the router in handler tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
# WS client for the ws.rs integration test (ws_forwards_org_matching_events).
# Version 0.26 is already in the workspace Cargo.lock via henosis-rift-bridge.
tokio-tungstenite = { version = "0.26" }
# StreamExt::next() on the tungstenite WebSocketStream in ws.rs tests.
futures = { workspace = true }
# Tests opt into the allow-all stub chain; the non-default `stubs` feature never reaches a
# normal (release) build of the binary.
syntheos-dispatch = { path = "../syntheos-dispatch", features = ["stubs"] }
# Exposes MockPolicyBackend and FrozenClock so gate-chain tests can exercise PlutusGate
# without a live Postgres connection.
henosis-plutus = { path = "../henosis-plutus", features = ["test-helpers"] }

[features]
default = []
# The in-process cognitive core is off by default so standard builds do not compile the
# vendored kleos-lib ML stack. Enabling it adds the cognition field to AppState.
cognition = ["dep:henosis-cognition"]
