[package]
name = "syntheos-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The single HTTP entry point that boots the Henosis foundation."

[dependencies]
# The Phase 0 foundation this server wires together.
syntheos-contracts = { path = "../syntheos-contracts" }
syntheos-axon = { path = "../syntheos-axon" }
syntheos-dispatch = { path = "../syntheos-dispatch" }
syntheos-identity = { path = "../syntheos-identity" }
# Phase 1 kernel services, wired into AppState as they are extracted (Story 1.7).
henosis-chiasm = { path = "../henosis-chiasm" }
henosis-soma = { path = "../henosis-soma" }
henosis-broca = { path = "../henosis-broca" }
henosis-loom = { path = "../henosis-loom" }
henosis-thymus = { path = "../henosis-thymus" }
# The eidolon authority: the real gate in the eidolon slot + the output filter (Story 2.6).
henosis-eidolon = { path = "../henosis-eidolon" }
# The pistis authority: the real gate in the pistis slot (Story 3.3).
henosis-pistis = { path = "../henosis-pistis" }
# The phylax authority: the real gate in the phylax slot (Story 3.6).
henosis-phylax = { path = "../henosis-phylax" }
# The human-in-the-loop authority: the real gate in the human slot (Story 4.6).
henosis-rift = { path = "../henosis-rift" }
# The cognitive core facade over vendored kleos-lib (Wave 2). OPTIONAL: only the
# `cognition` feature pulls it -- and with it the heavy ML stack -- in, so the
# default Henosis build stays free of ort/tokenizers/lancedb. Additive wiring.
henosis-cognition = { path = "../henosis-cognition", optional = true }
# Decoding the SYNTHEOS_PHYLAX_KEY hex master key at boot.
hex.workspace = true
# HTTP surface.
axum.workspace = true
# Global concurrency cap on the HTTP surface (resource-limit hardening).
tower = { version = "0.5", features = ["limit"] }
# Per-request timeout layer (resource-limit hardening).
tower-http = { version = "0.6", features = ["timeout"] }
# Full runtime: the binary needs rt, net, signal, and macros.
tokio = { workspace = true }
# EnrollRequest body.
serde.workspace = true
# JSON responses.
serde_json.workspace = true
# The QualitySink adapter (Thymus -> Soma) implements an async trait.
async-trait.workspace = true
# Structured logging.
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# ServiceExt::oneshot drives the router in handler tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
# Tests opt into the allow-all stub chain; the non-default `stubs` feature never reaches a
# normal (release) build of the binary.
syntheos-dispatch = { path = "../syntheos-dispatch", features = ["stubs"] }

[features]
default = []
# The in-process cognitive core (Wave 2). OFF by default so the standard build
# does not compile the vendored kleos-lib ML stack; turning it on adds the
# `cognition` field to AppState and pulls henosis-cognition in.
cognition = ["dep:henosis-cognition"]
# Real service surfaces land here as they are absorbed (e.g. "rift", "synapse", "hermes").
