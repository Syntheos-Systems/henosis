[package]
name = "syntheos-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The single HTTP entry point that boots the Henosis foundation."

[dependencies]
# The Phase 0 foundation this server wires together.
syntheos-contracts = { path = "../syntheos-contracts" }
syntheos-axon = { path = "../syntheos-axon" }
syntheos-dispatch = { path = "../syntheos-dispatch" }
syntheos-identity = { path = "../syntheos-identity" }
# Phase 1 kernel services, wired into AppState as they are extracted (Story 1.7).
henosis-chiasm = { path = "../henosis-chiasm" }
henosis-soma = { path = "../henosis-soma" }
henosis-broca = { path = "../henosis-broca" }
# HTTP surface.
axum.workspace = true
# Global concurrency cap on the HTTP surface (resource-limit hardening).
tower = { version = "0.5", features = ["limit"] }
# Per-request timeout layer (resource-limit hardening).
tower-http = { version = "0.6", features = ["timeout"] }
# Full runtime: the binary needs rt, net, signal, and macros.
tokio = { workspace = true }
# EnrollRequest body.
serde.workspace = true
# JSON responses.
serde_json.workspace = true
# Structured logging.
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# ServiceExt::oneshot drives the router in handler tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
# Tests opt into the allow-all stub chain; the non-default `stubs` feature never reaches a
# normal (release) build of the binary.
syntheos-dispatch = { path = "../syntheos-dispatch", features = ["stubs"] }

[features]
default = []
# Real service surfaces land here as they are absorbed (e.g. "rift", "synapse", "hermes").
