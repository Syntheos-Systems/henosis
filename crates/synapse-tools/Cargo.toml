[package]
name = "synapse-tools"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool registry and built-in integrations for Synapse."

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
walkdir = "2"
hostname = { workspace = true }
# Workspace memory client for signed Kleos requests.
henosis-memory-client = { path = "../henosis-memory-client" }
synapse-session = { path = "../synapse-session" }
synapse-provider = { path = "../synapse-provider" }
urlencoding = "2"
# Optional in-process Pistis authority backend. Off by default so Synapse
# remains standalone; Henosis enables it for room-state authorization.
henosis-pistis = { path = "../henosis-pistis", optional = true }
syntheos-contracts = { path = "../syntheos-contracts", optional = true }
# Only used by the henosis-pistis-backed authority tests (clock construction).
time = { workspace = true, optional = true }

[features]
# Back PistisGate with the in-process henosis-pistis room-state authority.
henosis-pistis = ["dep:henosis-pistis", "dep:syntheos-contracts", "dep:time"]
