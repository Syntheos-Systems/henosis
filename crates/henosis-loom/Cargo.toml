[package]
name = "henosis-loom"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Loom: the workflow-orchestration kernel service, extracted onto syntheos-contracts + in-process Axon."

[dependencies]
# Canonical ids (WorkflowId/RunId/PrincipalId/TenantId), Timestamp, and the TypedEvent trait.
syntheos-contracts = { path = "../syntheos-contracts" }
# In-process bus the workflow lifecycle events are published onto.
syntheos-axon = { path = "../syntheos-axon" }
# SQLite backend (bundled = no system libsqlite). Migration convention: PRAGMA user_version.
rusqlite = { workspace = true, features = ["bundled"] }
# LoomError.
thiserror.workspace = true
# StepDef/config JSON and event payloads.
serde = { workspace = true }
serde_json.workspace = true
# Fire-and-forget event-emission failures are logged, never fatal.
tracing.workspace = true
# The object-safe async StepExecutor seam.
async-trait.workspace = true
# Step timeout arithmetic (Timestamp wraps time::OffsetDateTime).
time.workspace = true

[dev-dependencies]
# Workspace tokio is "full" -- runtime + macros for #[tokio::test].
tokio = { workspace = true }
