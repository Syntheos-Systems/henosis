[package]
name = "henosis-chiasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Chiasm: tenant-scoped task coordination over an in-process event bus."

[dependencies]
# Canonical ids (TaskId/TenantId/PrincipalId), Timestamp, and the TypedEvent trait.
syntheos-contracts = { path = "../syntheos-contracts" }
# In-process bus the task lifecycle events are published onto.
syntheos-axon = { path = "../syntheos-axon" }
# PrincipalDirectory: the enrollment authority the legacy backfill mints principals through.
syntheos-identity = { path = "../syntheos-identity" }
# SQLite backend (bundled = no system libsqlite), versioned with PRAGMA user_version.
rusqlite = { workspace = true, features = ["bundled"] }
# ChiasmError.
thiserror.workspace = true
# Status (de)serialization and event payloads.
serde = { workspace = true }
serde_json.workspace = true
# Fire-and-forget event-emission failures are logged, never fatal.
tracing.workspace = true
# Duration arithmetic for path-claim TTL leases (Timestamp wraps time::OffsetDateTime).
time.workspace = true
# Runtime for the chiasm-backfill CLI only (the library itself stays runtime-free).
tokio = { workspace = true, optional = true }

[features]
# Enables the one-time `chiasm-backfill` migration CLI (pulls in a tokio runtime).
backfill-cli = ["dep:tokio"]

[[bin]]
name = "chiasm-backfill"
required-features = ["backfill-cli"]

[dev-dependencies]
# Workspace tokio is "full" -- runtime + macros for #[tokio::test].
tokio = { workspace = true }
