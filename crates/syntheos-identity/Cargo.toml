[package]
name = "syntheos-identity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The principal directory: the canonical actor registry gates resolve against."

[dependencies]
# Race-resistant, literal-path SQLite opening for persistent identity state.
henosis-sqlite = { path = "../henosis-sqlite" }
# The canonical Principal / PrincipalKind / PrincipalId this registry stores.
syntheos-contracts = { path = "../syntheos-contracts" }
# Object-safe async trait so a storage backend can swap in without churning callers.
async-trait.workspace = true
# DirectoryError.
thiserror.workspace = true
# SQLite backend for the persistent directory (SqliteDirectory). `bundled` avoids a system
# libsqlite dependency. Migration convention: PRAGMA user_version + migrations/Vn__*.sql.
rusqlite = { workspace = true, features = ["bundled"] }
# PrincipalKind is stored as its serde string form.
serde_json.workspace = true
# Argon2id password hashing for operator-account credentials (Task 1 / Athena plan A).
# Version pinned to match henosis-rift-server. Default features include password-hash
# re-exports; rand_core::OsRng + SaltString::generate are available at this version.
argon2 = { version = "0.5", features = ["std"] }
# Fixed-size authority-secret digests.
sha2.workspace = true
# Machine-token and refresh-secret base64url encoding.
base64.workspace = true
# Constant-time digest equality during credential authentication.
subtle.workspace = true
# UUID record identifiers for opaque authority credentials.
uuid.workspace = true
# Clears decoded and generated authority-secret buffers when they leave scope.
zeroize.workspace = true
# Cryptographically secure authority-secret generation.
rand.workspace = true

[dev-dependencies]
# Workspace tokio is "full" -- runtime + macros for #[tokio::test].
tokio = { workspace = true }
