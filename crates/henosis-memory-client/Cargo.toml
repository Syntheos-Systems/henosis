[package]
name = "henosis-memory-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transitional HTTP client + Ed25519 request signer for Synapse's memory/coordination access during absorption. Software-key only (no PIV/YubiKey); retired when in-process kernel dispatch lands."

[dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
