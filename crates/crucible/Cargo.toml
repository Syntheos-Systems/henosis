[package]
name = "crucible"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Copied code keeps its license (the rest of the workspace may differ).
license = "Elastic-2.0"
repository.workspace = true
description = "Crucible structured-reasoning and code-quality gates for Henosis."

[features]
# The CLI ships with the HTTP skills bridge; in-process consumers (syntheos-server) can opt out
# and inject their own SkillsBridge.
default = ["http-bridge"]
# Blocking reqwest implementation of SkillsBridge against the Kleos skills API through
# KLEOS_URL and optional KLEOS_API_KEY environment variables.
http-bridge = ["dep:reqwest"]

[[bin]]
name = "crucible"
path = "src/bin/crucible.rs"
required-features = ["http-bridge"]

[[bin]]
name = "agent-forge"
path = "src/bin/agent-forge.rs"
required-features = ["http-bridge"]

[dependencies]
# CLI argument parsing (bin only; bins share the crate dependency list).
clap = { version = "4", features = ["derive"] }
# Tool input structs and the Output envelope.
serde = { workspace = true }
serde_json.workspace = true
tokio.workspace = true
# The forge database (bundled = no system libsqlite, matching the kernel crates).
rusqlite = { workspace = true, features = ["bundled"] }
# Artifact ids use UUID v4 as required by the forge tool contract.
uuid = { workspace = true, features = ["v4"] }
# Forge timestamps use chrono-formatted text.
chrono = "0.4"
# Repo walking for the AST tools.
walkdir = "2"
ignore = "0.4"
# IoError/ToolError derives.
thiserror.workspace = true
# ~ expansion for the default DB path.
dirs = "5"
# Tree-sitter AST parsing per supported language.
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-json = "0.23"
# The HTTP skills bridge (feature-gated).
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[dev-dependencies]
tempfile = "3"
